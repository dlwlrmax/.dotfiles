# Keep ALSA outputs awake. Suspend/resume on idle sometimes leaves the
# EasyEffects chain silent until device is switched or EE toggled.
# After changing: systemctl --user restart wireplumber

monitor.alsa.rules = [
    {
        matches = [
            { node.name = "~alsa_output.*" }
        ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
            }
        }
    }
]

# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

gui:
  # Enable file icons (requires a Nerd Font in your terminal)
  nerdFontsVersion: "3"
  # Accordion effect: automatically expands the currently focused side panel
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 2
  # Show jump-to-panel numbers ([1], [2], etc.) in window titles
  showPanelJumps: true
  # Use fuzzy search instead of exact substring when pressing '/'
  filterMode: fuzzy
  # Keep 3 lines of context above/below cursor when scrolling
  scrollOffMargin: 3
  # Cleaner, high-contrast active borders and selection
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    selectedRangeBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'
    markedBaseCommitFgColor:
      - '#f9e2af'
    markedBaseCommitBgColor:
      - '#45475a'
git:
  # Use `delta` for syntax-highlighted, side-by-side diffs (requires `git-delta` installed)
  # Note: For lazygit < 0.64, use `paging: { colorArg: always, pager: delta --dark --paging=never }`
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --line-numbers
  commit:
    # Automatically wrap commit message body at 72 characters
    autoWrapCommitMessage: true
    autoWrapWidth: 72
  # Automatically extract ticket IDs from branch names (e.g., feat/ABC-123 -> "[ABC-123] ")
  commitPrefix:
    - pattern: "^\\w+\\/(\\w+-\\w+).*"
      replace: "[$1] "
os:
  # Set your preferred editor preset: vim, nvim, vscode, helix, nano, emacs, etc.
  editPreset: "nvim"
# Power-user custom commands
customCommands:
  # Safe force push with lease (Press 'P' in Local Branches panel)
  - key: "P"
    context: "localBranches"
    description: "Force push with lease"
    command: "git push --force-with-lease origin {{.SelectedLocalBranch.Name}}"
    loadingText: "Force pushing..."
  # Structured branch creation menu (Press 'C' in Local Branches panel)
  - key: "C"
    context: "localBranches"
    description: "Create conventional branch"
    prompts:
      - type: "menu"
        title: "Branch type"
        key: "Type"
        options:
          - name: "feat"
            value: "feat"
          - name: "fix"
            value: "fix"
          - name: "chore"
            value: "chore"
          - name: "refactor"
            value: "refactor"
      - type: "input"
        title: "Branch name (kebab-case)"
        key: "Name"
    command: "git checkout -b {{.Form.Type}}/{{.Form.Name}}"
    loadingText: "Creating branch..."
  # Fetch and prune deleted remote branches (Press 'F' in Local Branches panel)
  - key: "F"
    context: "localBranches"
    description: "Fetch and prune"
    command: "git fetch --prune"
    loadingText: "Fetching & pruning..."

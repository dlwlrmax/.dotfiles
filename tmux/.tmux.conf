# install tpm: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Press prefix + I (capital i, as in Install) to fetch the plugin
# Press prefix + alt + u (lowercase u as in uninstall) to remove the plugin.
# prefix + U updates plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'b0o/tmux-autoreload'

# Update terminal window title (Ghostty) with tmux session/window name
set -g set-titles on
set -g set-titles-string "[#{session_name}] #W"

set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',*:Tc,xterm*:Tc'

set -g allow-passthrough on
setw -g mode-keys vi
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g history-limit 50000
set -g status-interval 5
set -g set-clipboard on
set -g detach-on-destroy off
set -g focus-events on
set -g @yank_selection 'clipboard' # or 'primary' 'secondary' or 'clipboard'
set -g @yank_selection_mouse 'clipboard' # or 'clipboard' 'primary' or 'secondary'


set-option -g prefix C-a
bind-key C-a send-prefix
# Copy mode (prefix + v enters copy mode; y/Y yank handled in post-plugin block below)
bind v copy-mode
# Selection / search highlight (search styles need thm vars; mode-style set post-plugin)
set -g copy-mode-match-style 'bg=#{@thm_yellow},fg=#{@thm_mantle}'
set -g copy-mode-current-match-style 'bg=#{@thm_peach},fg=#{@thm_mantle},bold'

# Config for nvim-tmux
# navigation
set -g @tmux-nvim-navigation true
set -g @tmux-nvim-navigation-cycle true
set -g @tmux-nvim-navigation-keybinding-left 'C-h'
set -g @tmux-nvim-navigation-keybinding-down 'C-j'
set -g @tmux-nvim-navigation-keybinding-up 'C-k'
set -g @tmux-nvim-navigation-keybinding-right 'C-l'

# resize
set -g @tmux-nvim-resize true
set -g @tmux-nvim-resize-step-x 2
set -g @tmux-nvim-resize-step-y 2
set -g @tmux-nvim-resize-keybinding-left 'M-h'
set -g @tmux-nvim-resize-keybinding-down 'M-j'
set -g @tmux-nvim-resize-keybinding-up 'M-k'
set -g @tmux-nvim-resize-keybinding-right 'M-l'


# Kill without confirm
bind-key & kill-window
bind-key x kill-pane


# Config for catppuccin
set -g status-right-length 100
set -g status-left-length 100
set -g status-right ""
set -g status-style 'bg=terminal'

set -g @catppuccin_flavor 'mocha'

# status left style - consolidated
set -g status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_mantle},bold]  #S },#{#[bg=#{@thm_mantle},fg=#{@thm_green}]  #S }}#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]"

# status right style - consolidated from previous settings
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# window style
set -wg automatic-rename on
# NOTE: automatic-rename-format managed by tmux-nerd-font-window-name plugin
set -g window-status-separator ''
set -g status-justify 'absolute-centre'
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_flags ""
set -g @catppuccin_window_number ""
set -g @catppuccin_window_text "#[fg=#{@thm_rosewater},bg=#{@thm_mantle}] #I#{?#{!=:#{window_name},},: #W,} "
set -g @catppuccin_window_current_number ""
set -g @catppuccin_window_current_text "#[fg=#{@thm_mantle},bg=#{@thm_peach}] #I#{?#{!=:#{window_name},},: #W,} "

# Configure Online
# (tmux-online-status not in plugin list; @online_icon/@offline_icon removed)

# Config fzf
TMUX_FZF_OPTIONS="-p -w 70% -h 50%"
TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_PREVIEW=0

# window rename
bind-key "r" command-prompt -I'#W' { rename-window -- '%%' }

# config for tmux-fingers
set -g @fingers-key "f"

# Popup
bind "g" display-popup -d "#{pane_current_path}" -w 90% -h 90% -S 'fg=green,bold' -E -T "Git UI" "gitui"
bind "m" display-popup -d "#{pane_current_path}" -w 90% -h 90% -S 'fg=blue,bold' -E -T "Docker UI" "lazydocker"
bind t display-popup -d '#{pane_current_path}' -w90% -h90% \
  -S 'fg=yellow,bold' -E -T 'Laravel Log' \
  'exec zsh -lic "llog"'

# Switch window (prefix + a)
bind-key "a" run-shell -b "$HOME/.tmux/plugins/tmux-fzf/scripts/window.sh switch"


# Define reusable sesh command (script lives in .local/bin/sesh-fzf)
set -g @sesh-fzf "$HOME/.local/bin/sesh-fzf"

# Store the last session command as a reusable option to avoid duplication
set -g @sesh-last-session-command 'sesh connect $(sesh list -t | grep -v -E "(opencode|qwen)" | head -2 | tail -1)'

bind-key "C-s" run-shell '#{@sesh-fzf}'
bind-key "w" run-shell '#{@sesh-fzf}'

unbind-key q
bind -N "last-session (via sesh)" q run-shell '#{@sesh-last-session-command}'


# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# --- post-plugin overrides (must stay below tpm so plugin binds don't win) ---
set -g @tmux-clip "$HOME/.local/bin/tmux-clip"

# catppuccin forces mode-style via `set -gF`, so override it here
set -g mode-style 'bg=#{@thm_surface_1},fg=#{@thm_fg},bold'

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip"
bind-key -T copy-mode-vi Y send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip"
bind-key -T copy-mode-vi M-y send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip; tmux paste-buffer -p"

bind l run-shell '#{@sesh-last-session-command}'

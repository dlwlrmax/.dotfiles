general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = $HOME/.config/hypr/scripts/dpms.sh on  # to avoid having to press a key twice to turn on the display.
}

# No backlight/kbd_backlight devices on this desktop (external DP/HDMI only),
# so the brightnessctl dim listeners were dropped: they spawned no-op commands.

listener {
    timeout = 1800                                # 30min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 1830                                # 30.5min
    on-timeout = $HOME/.config/hypr/scripts/dpms.sh off   # screen off when timeout has passed
    on-resume = $HOME/.config/hypr/scripts/dpms.sh on     # screen on when activity is detected after timeout has fired.
}
